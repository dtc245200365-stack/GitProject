<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Danh sách sản phẩm</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
        }

        h1 {
            text-align: center;
        }

        table {
            width: 600px;
            margin: 20px auto;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #333;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #ddd;
        }
    </style>
</head>

<body>

    <h1>Danh sách sản phẩm</h1>

    <table>
        <tr>
            <th>Tên sản phẩm</th>
            <th>Giá</th>
            <th>Số lượng</th>
        </tr>

        <tr>
            <td>Laptop</td>
            <td>15.000.000 VNĐ</td>
            <td>10</td>
        </tr>

        <tr>
            <td>Điện thoại</td>
            <td>8.000.000 VNĐ</td>
            <td>20</td>
        </tr>

        <tr>
            <td>Tai nghe</td>
            <td>500.000 VNĐ</td>
            <td>30</td>
        </tr>

        <tr>
            <td>Bàn phím</td>
            <td>700.000 VNĐ</td>
            <td>15</td>
        </tr>
    </table>

</body>
</html>
