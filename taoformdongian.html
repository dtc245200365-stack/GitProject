<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập tạo form</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f4f7;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
        }

        .form-box {
            background-color: white;
            padding: 25px;
            margin-bottom: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        h2 {
            color: #2980b9;
            border-bottom: 2px solid #2980b9;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            color: #34495e;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        textarea,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        textarea {
            resize: vertical;
        }

        .inline label {
            display: inline-block;
            font-weight: normal;
            margin-right: 20px;
        }

        .inline input {
            margin-right: 5px;
        }

        .buttons {
            margin-top: 20px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
            margin-right: 10px;
        }

        .submit-btn {
            background-color: #3498db;
            color: white;
        }

        .reset-btn {
            background-color: #95a5a6;
            color: white;
        }

        button:hover {
            opacity: 0.85;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>BÀI TẬP TẠO FORM</h1>

    <!-- PHẦN 1 -->
    <div class="form-box">
        <h2>Phần 1: Form thông tin cá nhân</h2>

        <form action="#" method="post">

            <div class="form-group">
                <label for="yourname">Họ và tên:</label>
                <input type="text" id="yourname" name="yourname"
                       placeholder="Nhập họ và tên">
            </div>

            <div class="form-group">
                <label for="email1">Email:</label>
                <input type="email" id="email1" name="email"
                       placeholder="Nhập email">
            </div>

            <div class="form-group">
                <label>Sở thích:</label>

                <div class="inline">
                    <label>
                        <input type="checkbox" name="hobby" value="reading">
                        Đọc sách
                    </label>

                    <label>
                        <input type="checkbox" name="hobby" value="music">
                        Nghe nhạc
                    </label>

                    <label>
                        <input type="checkbox" name="hobby" value="sports">
                        Thể thao
                    </label>
                </div>
            </div>

            <div class="buttons">
                <button type="submit" class="submit-btn">
                    Gửi thông tin
                </button>

                <button type="reset" class="reset-btn">
                    Nhập lại
                </button>
            </div>

        </form>
    </div>


    <!-- PHẦN 2 -->
    <div class="form-box">
        <h2>Phần 2: Form đăng ký học viên</h2>

        <form action="#" method="post">

            <div class="form-group">
                <label for="fullname">Họ và tên:</label>
                <input type="text" id="fullname" name="fullname"
                       placeholder="Nhập họ và tên">
            </div>

            <div class="form-group">
                <label for="email2">Email:</label>
                <input type="email" id="email2" name="email"
                       placeholder="Nhập email">
            </div>

            <div class="form-group">
                <label for="phone">Số điện thoại:</label>
                <input type="text" id="phone" name="phone"
                       placeholder="Nhập số điện thoại">
            </div>

            <div class="form-group">
                <label for="birthday">Ngày sinh:</label>
                <input type="date" id="birthday" name="birthday">
            </div>

            <div class="form-group">
                <label>Giới tính:</label>

                <div class="inline">
                    <label>
                        <input type="radio" name="gender" value="Nam">
                        Nam
                    </label>

                    <label>
                        <input type="radio" name="gender" value="Nữ">
                        Nữ
                    </label>

                    <label>
                        <input type="radio" name="gender" value="Khác">
                        Khác
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="address">Địa chỉ:</label>
                <textarea id="address" name="address"
                          rows="3"
                          placeholder="Nhập địa chỉ"></textarea>
            </div>

            <div class="form-group">
                <label for="course">Khóa học:</label>

                <select id="course" name="course">
                    <option value="">-- Chọn khóa học --</option>
                    <option value="html-css">HTML & CSS</option>
                    <option value="javascript">JavaScript</option>
                    <option value="java">Java</option>
                    <option value="python">Python</option>
                </select>
            </div>

            <div class="form-group">
                <label>Hình thức học:</label>

                <div class="inline">
                    <label>
                        <input type="radio" name="study_type" value="Online">
                        Online
                    </label>

                    <label>
                        <input type="radio" name="study_type" value="Offline">
                        Offline
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label>Sở thích:</label>

                <div class="inline">
                    <label>
                        <input type="checkbox" name="hobby" value="reading">
                        Đọc sách
                    </label>

                    <label>
                        <input type="checkbox" name="hobby" value="music">
                        Nghe nhạc
                    </label>

                    <label>
                        <input type="checkbox" name="hobby" value="sports">
                        Thể thao
                    </label>

                    <label>
                        <input type="checkbox" name="hobby" value="travel">
                        Du lịch
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="note">Ghi chú:</label>
                <textarea id="note" name="note"
                          rows="4"
                          placeholder="Nhập ghi chú"></textarea>
            </div>

            <div class="buttons">
                <button type="submit" class="submit-btn">
                    Đăng ký
                </button>

                <button type="reset" class="reset-btn">
                    Nhập lại
                </button>
            </div>

        </form>
    </div>

</div>

</body>
</html>
