<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký người dùng</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        .form-container {
            width: 500px;
            margin: 50px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
            box-sizing: border-box;
        }

        .gender label {
            display: inline-block;
            font-weight: normal;
            margin-right: 20px;
        }

        .buttons {
            text-align: center;
            margin-top: 25px;
        }

        input[type="submit"],
        input[type="reset"] {
            padding: 10px 25px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
        }

        input[type="submit"] {
            background-color: #3498db;
            color: white;
        }

        input[type="reset"] {
            background-color: #999;
            color: white;
        }
    </style>
</head>

<body>

<div class="form-container">

    <h2>ĐĂNG KÝ NGƯỜI DÙNG</h2>

    <form action="http://demo.codegym.vn/6/registration_form/register.php"
          method="POST">

        <div class="form-group">
            <label for="name">Họ và tên:</label>
            <input type="text"
                   id="name"
                   name="name"
                   placeholder="Nhập họ và tên"
                   required>
        </div>

        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email"
                   id="email"
                   name="email"
                   placeholder="Nhập email"
                   required>
        </div>

        <div class="form-group">
            <label for="phone">Số điện thoại:</label>
            <input type="text"
                   id="phone"
                   name="phone"
                   placeholder="Nhập số điện thoại"
                   required>
        </div>

        <div class="form-group gender">
            <label>Giới tính:</label>

            <label>
                <input type="radio"
                       name="gender"
                       value="Nam"
                       required>
                Nam
            </label>

            <label>
                <input type="radio"
                       name="gender"
                       value="Nữ">
                Nữ
            </label>
        </div>

        <div class="buttons">
            <input type="submit" value="Đăng ký">
            <input type="reset" value="Nhập lại">
        </div>

    </form>

</div>

</body>
</html>
