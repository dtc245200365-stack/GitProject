<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Lịch họp công ty</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
            background-color: #f5f5f5;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        table {
            width: 700px;
            margin: 20px auto;
            border-collapse: collapse;
            background-color: white;
        }

        th, td {
            border: 1px solid #333;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #ddd;
        }
    </style>
</head>

<body>

    <h1>Lịch họp công ty</h1>

    <table>
        <tr>
            <th>Ngày</th>
            <th>Giờ</th>
            <th>Nội dung cuộc họp</th>
        </tr>

        <tr>
            <td rowspan="2">Thứ Hai<br>06/10/2026</td>
            <td>08:00 - 09:00</td>
            <td>Họp giao ban đầu tuần</td>
        </tr>

        <tr>
            <td>14:00 - 15:00</td>
            <td>Họp phòng kinh doanh</td>
        </tr>

        <tr>
            <td rowspan="2">Thứ Ba<br>07/10/2026</td>
            <td>09:00 - 10:00</td>
            <td>Họp phòng kỹ thuật</td>
        </tr>

        <tr>
            <td colspan="2">14:00 - 17:00 - Hội nghị tổng kết quý</td>
        </tr>

        <tr>
            <td>Thứ Tư<br>08/10/2026</td>
            <td colspan="2">08:00 - 12:00 - Đào tạo nhân viên</td>
        </tr>

    </table>

</body>
</html>
